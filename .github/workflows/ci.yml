name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: valuation
          POSTGRES_PASSWORD: valuation
          POSTGRES_DB: valuation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valuation -d valuation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://valuation:valuation@localhost:5432/valuation
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-test-secret
      SCREENER_BASE_URL: https://www.screener.in
      SCRAPE_DELAY_SECONDS: "2"
      EXPORTS_DIR: /tmp/exports

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest -v
