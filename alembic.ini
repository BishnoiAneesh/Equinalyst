[alembic]
script_location = alembic
prepend_sys_path = .
# Naming convention: YYYY_MM_DD_HHMM-<slug>. Keeps migrations sorted
# chronologically in a file listing without relying on the hidden revision id.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(slug)s
# sqlalchemy.url is intentionally omitted here — env.py reads DATABASE_URL
# from app.core.config.get_settings() so a single source of truth (.env)
# drives both the app and migrations.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
